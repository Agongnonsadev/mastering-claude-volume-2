# Chapter 16: the Comptoir online on a small server, behind Caddy, which obtains and renews
# the HTTPS certificate by itself (Let's Encrypt). On the server, in this folder:
#   cp .env.example .env   (then fill it in)
#   docker compose up -d --build
services:
  comptoir:
    build:
      context: ../..
      dockerfile: ch16/deployment/Dockerfile
    env_file: .env
    volumes:
      - ./data:/data                # shop.sqlite3 and authorization.sqlite3
    restart: unless-stopped
    # No published port: only Caddy reaches the server, through Docker's internal network.

  caddy:
    image: caddy:2.11.7
    ports:
      - "80:80"
      - "443:443"
    environment:
      COMPTOIR_DOMAIN: ${COMPTOIR_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    restart: unless-stopped

volumes:
  caddy_data:
